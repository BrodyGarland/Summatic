<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summatic — mental arithmetic trainer</title>
<meta name="description" content="A mental arithmetic speed trainer that times every problem, finds the category slowing you down, and points you at the method that fixes it.">
<meta name="theme-color" content="#0E1216">
<meta property="og:title" content="Summatic">
<meta property="og:description" content="Mental arithmetic drills that tell you what to fix, not just what you scored.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230E1216'/><rect x='6' y='19' width='3' height='7' fill='%235A3410'/><rect x='11' y='15' width='3' height='11' fill='%23C4661A'/><rect x='16' y='11' width='3' height='15' fill='%23F2A03D'/><rect x='21' y='7' width='3' height='19' fill='%23FFD9A0'/></svg>">
 
<style>
:root{
  color-scheme:dark;
  --bg:#0E1216; --surface:#151B21; --line:#26313A; --line-soft:#1D252C;
  --text:#E6EAEE; --dim:#7C8A97; --dimmer:#4E5A65;
  --h0:#5A3410; --h1:#C4661A; --h2:#F2A03D; --h3:#FFD9A0; --h4:#FFFFFF;
  --cold:#3D4A57;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:4px; --pad:clamp(16px,4vw,32px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--h2);outline-offset:3px;border-radius:2px}
.app{min-height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:0 var(--pad)}
 
/* Header */
.rail{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  padding:clamp(12px,3vh,28px) 0 0}
.wordmark{grid-column:2;text-align:center;font-family:var(--mono);font-weight:600;
  font-size:clamp(28px,7.5vw,44px);letter-spacing:.1em;line-height:1}
.wordmark i{font-style:normal;color:var(--h2)}
.rail-link{grid-column:3;justify-self:end}
.tagline{font-size:13.5px;color:var(--dim);text-align:center;line-height:1.5;max-width:44ch;
  margin:0 auto}

.btnlink{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 18px;
  transition:color .15s,border-color .15s,background .15s,transform .15s}
.btnlink:hover{color:var(--text);border-color:var(--h2);background:rgba(242,160,61,.08)}
.btnlink.sm{padding:6px 13px;font-size:10.5px}
 
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
 
/* Setup */
#s-setup{justify-content:center;align-items:center;padding:clamp(24px,6vh,60px) 0}
.setup{width:100%;max-width:560px;display:flex;flex-direction:column;gap:clamp(26px,5vh,40px)}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gchip{border:1px solid var(--line);border-radius:var(--r);padding:20px 12px 16px;
  text-align:center;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.gchip:hover{border-color:var(--dimmer);transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.gchip[aria-pressed="true"]{border-color:var(--h2);background:rgba(242,160,61,.08)}
.gchip .glyph{display:block;font-family:var(--mono);font-size:26px;letter-spacing:.12em;
  color:var(--dimmer);line-height:1;margin-bottom:10px;transition:color .15s}
.gchip[aria-pressed="true"] .glyph{color:var(--h2)}
.gchip b{font-size:12.5px;font-weight:500;color:var(--dim);display:block}
.gchip[aria-pressed="true"] b{color:var(--text)}
 
.timer-set{display:flex;flex-direction:column;gap:14px}
.time-read{font-family:var(--mono);font-size:clamp(28px,7vw,40px);
  font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.time-read span{font-size:11px;color:var(--dimmer);letter-spacing:.16em;
  text-transform:uppercase;display:block;margin-top:9px}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:2px;
  background:var(--line);border-radius:2px;outline:none;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--h2);border:3px solid var(--bg);cursor:pointer}
.slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--h2);
  border:3px solid var(--bg);cursor:pointer}
.slider::-moz-range-track{width:100%;height:2px;background:var(--line);border-radius:2px;border:none}
.slider::-moz-range-progress{height:2px;background:var(--h2);border-radius:2px}
 
.start{font-family:var(--mono);font-size:clamp(16px,4vw,20px);font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;background:var(--h2);color:#0E1216;
  padding:22px;border-radius:var(--r);width:100%;transition:filter .15s,transform .15s;
  box-shadow:0 14px 32px -12px rgba(242,160,61,.45)}
.start:hover{filter:brightness(1.1);transform:translateY(-1px)}
.tip{font-family:var(--mono);font-size:11px;color:var(--dimmer);
  letter-spacing:.05em;text-align:center;margin-top:-22px}
 
/* Drill */
#s-drill{justify-content:center;align-items:center;text-align:center}
.hud{width:100%;display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.06em;
  padding-top:clamp(18px,4vh,32px)}
.hud .clock{font-size:20px;font-variant-numeric:tabular-nums;color:var(--text)}
.hud .clock.low{color:var(--h2)}
.hud .tally{font-variant-numeric:tabular-nums}
.hud .tally b{color:var(--text);font-weight:500}
.hud .streak{font-variant-numeric:tabular-nums}
.hud .streak b{display:inline-block;color:var(--h2);font-weight:600}
.hud .streak.pop b{animation:streakPop .38s ease}
@keyframes streakPop{0%{transform:scale(1)}45%{transform:scale(1.4);color:var(--h4)}100%{transform:scale(1)}}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:clamp(18px,4vh,34px);width:100%;padding:clamp(24px,7vh,64px) 0}
.problem{font-family:var(--mono);font-size:clamp(34px,9vw,62px);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.problem .op{color:var(--dim);margin:0 .18em}
.problem small{display:block;font-family:var(--mono);font-size:12px;color:var(--dimmer);
  letter-spacing:.1em;text-transform:uppercase;margin-top:10px}
.answer{width:min(340px,80vw);background:none;border:none;border-bottom:1.5px solid var(--line);
  text-align:center;font-family:var(--mono);font-size:clamp(30px,8vw,52px);
  font-variant-numeric:tabular-nums;padding:4px 0 10px;caret-color:var(--h2);
  transition:border-color .12s}
.answer:focus{outline:none;border-bottom-color:var(--h2)}
.flash{font-family:var(--mono);font-size:13px;height:18px;color:var(--cold);letter-spacing:.06em}
 
/* Ribbon */
.ribbon-wrap{width:100%;padding-bottom:22px}
.ribbon{display:flex;align-items:flex-end;gap:1.5px;height:38px;width:100%}
.ribbon .bar{flex:1 1 0;min-width:1px;border-radius:1px;transform-origin:bottom;
  animation:flare .22s ease-out}
@keyframes flare{from{opacity:.2;transform:scaleY(.4)}to{opacity:1;transform:scaleY(1)}}
.ribbon-key{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dimmer);margin-top:8px}
.ribbon-key .ramp{flex:1;height:2px;margin:0 12px;border-radius:1px;
  background:linear-gradient(90deg,hsl(36 55% 24%),hsl(36 75% 50%),hsl(36 92% 85%))}
 
/* Results */
#s-results{padding:clamp(8px,1.6vh,18px) 0 0}
.headline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 22px;margin-bottom:4px}
.headline .big{font-family:var(--mono);font-size:clamp(32px,7vw,48px);font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--dim);letter-spacing:.04em}
.stat b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.verdict{color:var(--dim);font-size:13.5px;max-width:58ch;margin:clamp(6px,1.4vh,12px) 0 clamp(10px,1.8vh,16px)}
.verdict b{color:var(--text);font-weight:500}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dimmer);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.block{margin-bottom:clamp(10px,2vh,18px)}
.table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
.table th{text-align:left;font-weight:400;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dimmer);padding:0 10px 8px 0;
  border-bottom:1px solid var(--line-soft)}
.table th:last-child,.table td:last-child{text-align:right;padding-right:0}
.table td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums}
.table tr:last-child td{border-bottom:none}
.table .lbl{color:var(--text)}
.table .muted{color:var(--dim)}
.mlink{color:var(--h2);font-family:var(--mono);font-size:11.5px;
  border-bottom:1px solid rgba(242,160,61,.3);padding-bottom:1px;white-space:nowrap}
.mlink:hover{border-bottom-color:var(--h2)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px}
.spark{width:100%;height:34px;display:block}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:clamp(12px,2.4vh,20px) 0;align-items:center}
.again{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;background:var(--h2);color:#0E1216;padding:16px 32px;
  border-radius:var(--r);transition:filter .15s,transform .15s;
  box-shadow:0 12px 28px -12px rgba(242,160,61,.4)}
.again:hover{filter:brightness(1.1);transform:translateY(-1px)}
.ghost{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:var(--r);padding:11px 16px;
  transition:color .15s,border-color .15s}
.ghost:hover{color:var(--text);border-color:var(--dimmer)}
.empty{font-family:var(--mono);font-size:12px;color:var(--dimmer);border:1px dashed var(--line);
  border-radius:var(--r);padding:16px;text-align:center}
 
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(6,9,11,.72);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:50%;left:50%;width:min(920px,95vw);max-height:min(90vh,820px);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 30px 70px rgba(0,0,0,.55);
  transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;
  transition:transform .18s cubic-bezier(.4,0,.2,1),opacity .18s;
  z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.drawer-top{display:flex;align-items:center;gap:14px;padding:14px 24px;
  border-bottom:1px solid var(--line);flex:none}
.tabs{flex:1;display:flex;gap:8px}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);padding:9px 16px;border-radius:999px;border:1px solid transparent;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-color:var(--line);background:var(--bg)}
.drawer-body{overflow-y:auto;padding:6px 28px 20px;-webkit-overflow-scrolling:touch}
.panel{display:none}
.panel.on{display:block}
.panel-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dimmer);margin:10px 0 8px}
.mtable-wrap{overflow:auto;border:1px solid var(--line-soft);border-radius:var(--r)}
.mtable{border-collapse:collapse;table-layout:fixed;font-family:var(--mono);font-size:10px;width:100%}
.mtable th,.mtable td{padding:4px 2px;text-align:center;overflow:hidden;text-overflow:clip;
  border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
.mtable td{color:var(--dim)}
.mtable tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.mtable td.diag{color:var(--h2);font-weight:600;background:rgba(242,160,61,.07)}
.mtable tr:first-child th{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--dimmer)}
.mtable tr th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);color:var(--dimmer)}
.mtable tr:first-child th:first-child{z-index:3}
.method{border-bottom:1px solid var(--line-soft);padding:16px 0}
.method.lit{background:rgba(242,160,61,.06);
  box-shadow:-14px 0 0 rgba(242,160,61,.06),14px 0 0 rgba(242,160,61,.06)}
.method h3{font-size:14.5px;font-weight:500;display:flex;align-items:baseline;gap:9px;
  flex-wrap:wrap;margin-bottom:5px}
.method h3 code{font-family:var(--mono);font-size:11.5px;color:var(--h2);font-weight:400}
.method p{font-size:13.5px;color:var(--dim);margin-bottom:9px}
.method .ex{font-family:var(--mono);font-size:12.5px;background:var(--bg);
  border-left:2px solid var(--h1);padding:9px 12px;border-radius:0 var(--r) var(--r) 0;
  display:grid;gap:4px;overflow-x:auto}
.method .ex i{font-style:normal;color:var(--dim)}
.drawer-note{font-size:12.5px;color:var(--dimmer);padding:16px 0 4px;
  border-bottom:1px solid var(--line-soft)}
.close{font-family:var(--mono);font-size:18px;color:var(--dim);padding:0 4px;line-height:1}
.close:hover{color:var(--text)}
 
.foot{padding:clamp(8px,1.6vh,14px) 0 clamp(10px,2vh,16px);border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:11px;color:var(--dimmer);display:flex;flex-wrap:wrap;
  align-items:center;gap:8px 12px;letter-spacing:.05em}
.foot-spacer{flex:1}
 
@media (max-width:520px){
  .groups{grid-template-columns:1fr}
  .gchip{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px}
  .gchip .glyph{margin-bottom:0;font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
 
  <header class="rail">
    <span></span>
    <button class="wordmark" id="btn-home" aria-label="Back to setup">SUMMAT<i>I</i>C</button>
    <button class="rail-link btnlink" id="btn-methods">Strategies</button>
  </header>

  <section class="screen on" id="s-setup">
    <div class="setup">
      <p class="tagline">Practice Mental Math.</p>
      <div class="groups" id="groups"></div>
      <div class="timer-set">
        <div class="time-read" id="time-read">2:00<span>time length</span></div>
        <input type="range" class="slider" id="dur" min="30" max="600" step="15" value="120"
               aria-label="Time length in seconds">
      </div>
      <button class="start" id="btn-start">Start</button>
    </div>
  </section>
 
  <section class="screen" id="s-drill">
    <div class="hud">
      <span class="clock" id="clock">2:00</span>
      <span class="streak" id="streak-wrap">streak <b id="t-streak">0</b></span>
      <span class="tally"><b id="t-right">0</b> right · <span id="t-wrong">0</span> missed</span>
    </div>
    <div class="stage">
      <div class="problem" id="problem">—</div>
      <input class="answer" id="answer" inputmode="decimal" autocomplete="off"
             autocorrect="off" spellcheck="false" aria-label="Your answer">
      <div class="flash" id="flash"></div>
    </div>
    <div class="ribbon-wrap">
      <div class="ribbon" id="ribbon"></div>
      <div class="ribbon-key"><span>6.0s</span><span class="ramp"></span><span>1.5s</span></div>
    </div>
  </section>
 
  <section class="screen" id="s-results">
    <div class="eyebrow">Session summary</div>
    <div class="headline">
      <span class="big" id="r-score">0</span>
      <span class="stat">accuracy <b id="r-acc">—</b></span>
      <span class="stat">median <b id="r-p50">—</b></span>
    </div>
    <p class="verdict" id="r-verdict"></p>
    <div class="ribbon-wrap" style="padding-bottom:14px">
      <div class="ribbon" id="r-ribbon" style="height:30px"></div>
      <div class="ribbon-key"><span>6.0s</span><span class="ramp"></span><span>1.5s</span></div>
    </div>
    <div class="block">
      <div class="eyebrow">What Happened</div>
      <table class="table" id="r-tags"></table>
    </div>
    <div class="block">
      <div class="eyebrow">Your last sessions</div>
      <div id="r-hist"></div>
    </div>
    <div class="actions">
      <button class="again" id="btn-again">Run it again</button>
      <button class="ghost" id="btn-clear">Clear history</button>
    </div>
  </section>
 
  <footer class="foot">
    <span>Summatic - </span><span>Free - </span>
    <span id="foot-store">Progress Saved In Browser</span>
    <span class="foot-spacer"></span>
    <span>Brody Garland</span>
    <a class="btnlink sm" href="https://www.linkedin.com/in/brody-garland-091854382/" target="_blank" rel="noopener">LinkedIn</a>
    <a class="btnlink sm" href="https://github.com/BrodyGarland" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>
 
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Strategies" aria-hidden="true">
  <div class="drawer-top">
    <div class="tabs" id="drawer-tabs">
      <button class="tab on" data-tab="methods">Methods</button>
      <button class="tab" data-tab="table">Times table</button>
    </div>
    <button class="close" id="btn-close-drawer" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
 
<script>
"use strict";
 
/* ══ STORAGE ══════════════════════════════════════════ */
const Store = (() => {
  let live = false, mem = {};
  try { const k="__s__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); live=true; }
  catch(e){ live=false; }
  return {
    live,
    get(key, fb){ try{ const r = live ? localStorage.getItem(key) : mem[key];
      return r==null ? fb : JSON.parse(r); }catch(e){ return fb; } },
    set(key, v){ const r=JSON.stringify(v);
      try{ live ? localStorage.setItem(key,r) : (mem[key]=r); }catch(e){ mem[key]=r; } },
    del(key){ try{ live ? localStorage.removeItem(key) : delete mem[key]; }catch(e){ delete mem[key]; } }
  };
})();
const K = { set:"summatic.v2.settings", ses:"summatic.v2.sessions", tag:"summatic.v2.tagstats" };
 
/* ══ METHODS ══════════════════════════════════════════ */
const METHODS = [
  { id:"dos", name:"Difference of squares", formula:"(m−d)(m+d) = m² − d²",
    body:"Fires when both numbers hug the same round midpoint. Average them; if the midpoint is clean, square it and subtract d². Turns a two-digit multiplication into a lookup plus a small subtraction — but only pays off if your squares are already instant.",
    ex:[["47 × 53","50² − 3² = 2500 − 9 = 2491"],["96 × 104","100² − 4² = 9984"],["34 × 26","30² − 4² = 884"]] },
  { id:"nearsq", name:"Near a square", formula:"(n+1)² = n² + n + (n+1)",
    body:"Extends your memorized squares past 50 without memorizing more. Step up: add the two numbers you're stepping between. Step down: subtract both. Separately — anything ending in 5, take the leading digits × the next integer and append 25.",
    ex:[["41²","1600 + 40 + 41 = 1681"],["39²","1600 − 40 − 39 = 1521"],["85²","8×9 = 72 → 7225"]] },
  { id:"l2r", name:"Left to right", formula:"tens first, then units",
    body:"The biggest habit change from school arithmetic. Right-to-left carrying is optimized for paper, not working memory. Going left to right fixes the magnitude first, so a partial answer is still useful. Never carry backwards — hold one running total.",
    ex:[["34 × 7","210 + 28 = 238"],["8 × 126","800 + 160 + 48 = 1008"]] },
  { id:"x11", name:"Multiply by 11", formula:"add adjacent digits inward",
    body:"Split the digits and drop their sum between them, carrying left when it exceeds 9. Extends to three digits by summing each adjacent pair.",
    ex:[["43 × 11","4 | 4+3 | 3 = 473"],["78 × 11","7 | 15 | 8 = 858"],["352 × 11","3 | 8 | 7 | 2 = 3872"]] },
  { id:"x5", name:"×5, ×25, ×125", formula:"halve, quarter, eighth — then shift",
    body:"5 = 10/2, 25 = 100/4, 125 = 1000/8. Divide, then move the decimal. Runs in reverse for division: n/25 = 4n/100.",
    ex:[["84 × 25","84/4 × 100 = 2100"],["36 × 5","18 × 10 = 180"],["48 × 125","6 × 1000 = 6000"]] },
  { id:"x9", name:"×9, ×99", formula:"round number minus one copy",
    body:"Multiply by the neighbouring round number and subtract a single copy. Same logic covers ×98 (subtract two) and ×101 (add one).",
    ex:[["37 × 9","370 − 37 = 333"],["46 × 99","4600 − 46 = 4554"]] },
  { id:"factor", name:"Factor and regroup", formula:"move a 2 across",
    body:"Halve one factor and double the other to make something round. Scan for this before reaching for anything harder.",
    ex:[["16 × 35","8 × 70 = 560"],["24 × 75","12 × 150 = 1800"],["18 × 45","9 × 90 = 810"]] },
  { id:"revmul", name:"Reverse multiply", formula:"guess, multiply back, correct",
    body:"Never long-divide. In a drill the problems divide evenly, so you aren't dividing at all — you're answering \"what times the divisor gives this?\" That reframe alone is worth seconds a problem.",
    ex:[["847 / 23","23×30 = 690, 157 left → 23×6 = 138 → ≈36.8"],["672 / 24","24×25 = 600, 72 left → 28"]] },
  { id:"scaledv", name:"Scale the divisor", formula:"make the divisor round",
    body:"Multiply both terms until the divisor is something you can handle. Dividing by a decimal is always a multiplication in disguise.",
    ex:[["n / 0.5","2n"],["n / 25","4n / 100"],["36 / 0.4","360 / 4 = 90"]] },
  { id:"fracfirst", name:"Fraction first", formula:"convert, then apply",
    body:"Recognize the fraction before touching the decimal. Percentages with clean fractional equivalents collapse to one division and one multiplication.",
    ex:[["5/8 of 320","320/8 = 40 → ×5 = 200"],["3/7 of 210","210/7 = 30 → ×3 = 90"],["37.5% of 64","3/8 × 64 = 24"]] },
  { id:"complement", name:"Complement subtraction", formula:"9, 9, … 10 from the left",
    body:"For round minuends, take each digit from 9 and the last from 10. Kills an entire class of borrow errors.",
    ex:[["1000 − 437","5 | 6 | 3 = 563"],["5000 − 2816","4999−2816 = 2183, +1 = 2184"]] },
  { id:"pctflip", name:"Percent flip", formula:"a% of b = b% of a",
    body:"Both sides are the same product. Take whichever direction is easier — it is almost never the one written down.",
    ex:[["18% of 50","50% of 18 = 9"],["4% of 75","75% of 4 = 3"],["16% of 25","25% of 16 = 4"]] },
  { id:"pctchange", name:"Percent change isn't symmetric", formula:"net ≈ −x²/100 %",
    body:"Up x% then down x% does not return you to where you started. The shortfall is roughly x²/100 percent. Down 50% needs up 100% to recover — the asymmetry grows fast.",
    ex:[["+20% then −20%","1.2 × 0.8 = 0.96 → −4%"],["+10% then −10%","−1%"]] },
  { id:"r72", name:"Rule of 72", formula:"doubling ≈ 72 / rate",
    body:"Divide 72 by the percentage rate for doubling time. Use 114 for tripling. Accurate enough between roughly 4% and 15%.",
    ex:[["8% a year","doubles in ~9 years"],["6% a year","doubles in ~12 years"]] },
  { id:"compound", name:"Small-rate compounding", formula:"(1+r)ⁿ ≈ 1 + nr + n(n−1)r²/2",
    body:"The linear term gets you close; the second term gets you to two decimals. Only worth the second term when n is large or precision is being tested.",
    ex:[["1.03⁵","1 + 0.15 + 0.009 = 1.159"],["1.02¹⁰","1 + 0.20 + 0.018 = 1.218"]] },
  { id:"digitcount", name:"Digit count first", formula:"magnitude, then digits",
    body:"Fix how big the answer is before computing a single digit. Prevents the error class that costs the most: right digits, wrong size.",
    ex:[["38 × 472","40 × 470 ≈ 18,800 → five digits, starts with 1"]] },
  { id:"nines", name:"Casting out nines", formula:"digit sums mod 9 must match",
    body:"A free error check costing about a second. Worth running on anything that felt shaky.",
    ex:[["38 × 47 = 1786","3+8→2, 4+7→2, 2×2 = 4; 1786 → 22 → 4 ✓"]] }
];
const METHOD_BY_ID = Object.fromEntries(METHODS.map(m => [m.id, m]));
 
const TAGS = {
  add_plain:["Addition, no carry","l2r"], add_carry:["Addition with carry","l2r"],
  sub_plain:["Subtraction, no borrow","l2r"], sub_borrow:["Subtraction with borrow","l2r"],
  sub_comp:["Subtraction from a round number","complement"],
  mul_small:["Small multiplication","l2r"], mul_2x1:["Two-digit × one-digit","l2r"],
  mul_2x2:["Two-digit × two-digit","l2r"], mul_dos:["Pairs straddling a midpoint","dos"],
  mul_square:["Squares","nearsq"], mul_11:["Multiplying by 11","x11"],
  mul_5s:["Multiplying by 5, 25, 125","x5"], mul_9s:["Multiplying by 9 or 99","x9"],
  mul_factor:["Regroupable factors","factor"],
  div_2s:["Dividing by 2, 4, 8","revmul"], div_5s:["Dividing by 5, 10, 25","scaledv"],
  div_3s:["Dividing by 3, 6, 9","revmul"], div_7:["Dividing by 7","revmul"],
  div_11:["Dividing by 11","revmul"], div_other:["Dividing by awkward numbers","revmul"],
  pct_of:["Percent of a number","pctflip"], pct_what:["What percent is x of y","fracfirst"],
  pct_change:["Percent change","pctchange"], pct_apply:["Applying an increase or cut","pctflip"],
  dec_mul:["Decimal multiplication","digitcount"], dec_div:["Decimal division","scaledv"],
  dec_frac:["Fraction to decimal","fracfirst"], dec_pct:["Fraction to percent","fracfirst"]

/* ══ GENERATION ═══════════════════════════════════════
   No difficulty settings by design. Each family samples
   its own full range every session, so easy and hard both
   always appear and there's nowhere to hide.
   ═════════════════════════════════════════════════════ */
const rnd = (lo,hi) => Math.floor(Math.random()*(hi-lo+1))+lo;
const pick = a => a[Math.floor(Math.random()*a.length)];
const round = (x,p) => Math.round(x*Math.pow(10,p))/Math.pow(10,p);
const digits = n => String(Math.abs(n)).length;
 
function hasCarry(a,b){ while(a>0||b>0){ if((a%10)+(b%10)>9) return true;
  a=Math.floor(a/10); b=Math.floor(b/10);} return false; }
function hasBorrow(a,b){ while(b>0){ if((a%10)<(b%10)) return true;
  a=Math.floor(a/10); b=Math.floor(b/10);} return false; }
 
function genAdd(){
  const t=Math.random(); let a,b;
  if (t<.55)      { a=rnd(11,99);   b=rnd(11,99); }
  else if (t<.85) { a=rnd(101,999); b=rnd(11,99); }
  else            { a=rnd(101,999); b=rnd(101,999); }
  return { cat:"add", tag:hasCarry(a,b)?"add_carry":"add_plain",
           text:`${a} <span class="op">+</span> ${b}`, answer:a+b };
}
function genSub(){
  if (Math.random()<.22){
    const base=pick([1000,1000,2000,5000,10000]);
    const b=rnd(Math.floor(base*.12), base-1);
    return { cat:"sub", tag:"sub_comp",
             text:`${base} <span class="op">−</span> ${b}`, answer:base-b };
  }
  const t=Math.random(); let a,b;
  if (t<.6) { a=rnd(11,99);   b=rnd(11,99); }
  else      { a=rnd(101,899); b=rnd(11,99); }
  const hi=a+b;
  return { cat:"sub", tag:hasBorrow(hi,b)?"sub_borrow":"sub_plain",
           text:`${hi} <span class="op">−</span> ${b}`, answer:a };
}
function mulTag(a,b){
  const da=digits(a), db=digits(b);
  if (da===1 && db===1) return "mul_small";
  const partner = k => (a===k ? b : a);
  if (a===b) return "mul_square";
  if ((a===11||b===11) && partner(11)>=10) return "mul_11";
  for (const f of [5,25,50,125]) if ((a===f||b===f) && partner(f)>=10) return "mul_5s";
  for (const n of [9,99])        if ((a===n||b===n) && partner(n)>=10) return "mul_9s";
  const mid=(a+b)/2, d=Math.abs(a-b)/2;
  if (Number.isInteger(mid) && d>0 && d<=7 && mid%5===0 && mid>=15) return "mul_dos";
  if (a>=10 && b>=10 && ((a%2===0&&b%5===0)||(b%2===0&&a%5===0))) return "mul_factor";
  if (da>=2 && db>=2) return "mul_2x2";
  return "mul_2x1";
}
function genMul(){
  let a,b; const t=Math.random();
  if (t<.34){
    switch (pick(["dos","x11","x5","x9","factor"])){
      case "dos":{ const mid=pick([15,20,25,30,35,40,45,50,50,60,70,80,90,100]);
                   const d=rnd(1,Math.min(7,mid-2)); a=mid-d; b=mid+d; break; }
      case "x11":  a=11; b=rnd(12,99); break;
      case "x5":   a=pick([5,25,25,125,50]); b=rnd(12,96); break;
      case "x9":   a=pick([9,99]); b=rnd(12,88); break;
      default:     a=pick([14,16,18,22,24,28,32,35,45,55,65,75]);
                   b=pick([15,25,35,45,55,65,75,85]);
    }
    if (Math.random()<.5){ const s=a; a=b; b=s; }
  } else if (t<.7){ a=rnd(2,12); b=rnd(13,99); if(Math.random()<.5){const s=a;a=b;b=s;} }
  else            { a=rnd(12,99); b=rnd(12,99); }
  return { cat:"mul", tag:mulTag(a,b),
           text:`${a} <span class="op">×</span> ${b}`, answer:a*b };
}
function divTag(d){
  if ([2,4,8,16,32].includes(d))       return "div_2s";
  if ([5,10,20,25,50,100].includes(d)) return "div_5s";
  if ([3,6,9,15,18].includes(d))       return "div_3s";
  if ([7,14,21,28].includes(d))        return "div_7";
  if ([11,12,22,33].includes(d))       return "div_11";
  return "div_other";
}
function genDiv(){
  const t=Math.random(); let d,q;
  if (t<.55)     { d=rnd(2,12);  q=rnd(3,99); }
  else if (t<.8) { d=rnd(13,25); q=rnd(3,40); }
  else           { d=pick([5,11,25,50,15,7]); q=rnd(4,80); }
  return { cat:"div", tag:divTag(d),
           text:`${d*q} <span class="op">÷</span> ${d}`, answer:q };
}
const NICE_PCT=[1,2,4,5,8,10,12,15,16,20,25,30,32,35,40,45,50,60,64,72,75,80,90,120,125,150];
const NICE_BASE=[20,24,25,30,32,36,40,44,48,50,60,64,70,75,80,84,90,96,100,120,125,150,160,200,240,250,300,400,500];
function genPct(){
  switch (pick(["of","of","what","change","apply"])){
    case "of":
      for (let i=0;i<40;i++){ const p=pick(NICE_PCT), n=pick(NICE_BASE), v=p*n/100;
        if (Number.isInteger(v)&&v>0) return { cat:"pct", tag:"pct_of",
          text:`${p}% <span class="op">of</span> ${n}`, answer:v }; }
      break;
    case "what":{
      const whole=pick([20,25,40,50,60,64,80,100,120,125,160,200,250]);
      const f=pick([.05,.1,.125,.2,.25,.375,.4,.5,.6,.625,.75,.8,.875]);
      const part=whole*f;
      if (Number.isInteger(part)) return { cat:"pct", tag:"pct_what",
        text:`${part} <span class="op">is what % of</span> ${whole}`,
        answer:round(f*100,2), unit:"%" };
      break; }
    case "change":{
      const from=pick([20,25,40,50,60,80,100,120,125,150,200,250]);
      const to=from*pick([.5,.75,.8,.9,1.1,1.2,1.25,1.5,1.6,2]);
      if (Number.isInteger(to)) return { cat:"pct", tag:"pct_change",
        text:`${from} <span class="op">→</span> ${to}<small>percent change</small>`,
        answer:round((to-from)/from*100,2), unit:"%" };
      break; }
    default:{
      const base=pick(NICE_BASE), p=pick([5,10,15,20,25,30,40,50,60,75]);
      const up=Math.random()<.5, v=up?base*(1+p/100):base*(1-p/100);
      if (Number.isInteger(v)) return { cat:"pct", tag:"pct_apply",
        text:`${base} <span class="op">${up?"+":"−"}</span> ${p}%`, answer:v };
    }
  }
  return { cat:"pct", tag:"pct_of", text:`25% <span class="op">of</span> 84`, answer:21 };
}
const FRACS=[[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,8],[3,8],[5,8],[7,8],
             [1,16],[1,20],[1,25],[3,20],[7,20],[1,32],[1,10],[3,10],[9,10],[1,40]];
function genDec(){
  const kind=pick(["mul","mul","div","frac","pct"]);
  if (kind==="mul"){
    const a=pick([.2,.25,.4,.5,.6,.75,.8,1.2,1.5,2.5,.05,.125,1.25,3.5]);
    const b=pick([4,6,8,12,16,20,24,25,32,40,48,60,64,80,100,120,200,240]);
    return { cat:"dec", tag:"dec_mul",
             text:`${a} <span class="op">×</span> ${b}`, answer:round(a*b,3) };
  }
  if (kind==="div"){
    const d=pick([.2,.25,.4,.5,.8,1.25,2.5,.05,.125]);
    const q=pick([4,6,8,12,15,16,20,24,25,30,36,40,48,60,80]);
    return { cat:"dec", tag:"dec_div",
             text:`${round(d*q,4)} <span class="op">÷</span> ${d}`, answer:q };
  }
  const [n,d]=pick(FRACS);
  if (kind==="frac") return { cat:"dec", tag:"dec_frac",
    text:`${n}/${d}<small>as a decimal</small>`, answer:round(n/d,5) };
  return { cat:"dec", tag:"dec_pct",
    text:`${n}/${d}<small>as a percent</small>`, answer:round(n/d*100,4), unit:"%" };
}
 
const GROUPS = [
  ["as","+ −","Addition & subtraction",    ["add","sub"]],
  ["md","× ÷","Multiplication & division", ["mul","div"]],
  ["pd","% ·","Percents & decimals",       ["pct","dec"]]
];
const GEN = { add:genAdd, sub:genSub, mul:genMul, div:genDiv, pct:genPct, dec:genDec };
 
function generate(){
  const cats=[];
  for (const [key,,,list] of GROUPS) if (S.groups[key]) cats.push(...list);
  return GEN[pick(cats.length ? cats : ["add"])]();
}

const DEFAULTS = { groups:{ as:true, md:true, pd:false }, duration:120 };
let S = Object.assign({}, DEFAULTS, Store.get(K.set,{}));

const $ = id => document.getElementById(id);

/* ══ HEAT RAMP — 6.0s dim amber, 1.5s bright gold ═════ */
const SLOW=6.0, FAST=1.5;
const heatT = l => Math.max(0, Math.min(1, (SLOW-l)/(SLOW-FAST)));
function heat(l){
  const t=heatT(l);
  return `hsl(36 ${Math.round(52+t*40)}% ${Math.round(24+t*61)}%)`;
}
function barFor(e){
  const b=el("div","bar");
  if (e.ok){ b.style.background=heat(e.lat); b.style.height=(26+heatT(e.lat)*74)+"%"; }
  else     { b.style.background="var(--cold)"; b.style.height="16%"; }
  return b;
}
function drawRibbon(node, log){
  node.innerHTML="";
  const f=document.createDocumentFragment();
  for (const e of log){
    const b=barFor(e);
    b.title=`${e.ok?"":"missed · "}${e.lat.toFixed(1)}s · ${(TAGS[e.tag]||["—"])[0]}`;
    f.appendChild(b);
  }
  node.appendChild(f);
}

/* ══ DRILL ════════════════════════════════════════════ */
function startDrill(){
  run={ started:Date.now(), endsAt:performance.now()+S.duration*1000,
        log:[], right:0, wrong:0, qStart:0, current:null, streak:0, best:0 };
  $("t-right").textContent="0"; $("t-wrong").textContent="0";
  $("t-streak").textContent="0"; $("streak-wrap").classList.remove("pop");
  $("ribbon").innerHTML=""; $("flash").textContent="";
  show("s-drill");
  nextProblem();
  $("answer").value=""; $("answer").focus();
  clearInterval(timerId); tick(); timerId=setInterval(tick,60);
}
function tick(){
  const left=Math.max(0, run.endsAt-performance.now())/1000;
  const c=$("clock");
  c.textContent=`${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,"0")}`;
  c.classList.toggle("low", left<=10);
  if (left<=0) finish();
}
function nextProblem(){
  const p=generate(); run.current=p; run.qStart=performance.now();
  $("problem").innerHTML=p.text+(p.unit?`<span class="op">${p.unit}</span>`:"");
  $("answer").value="";
}
function submit(ok){
  const lat=(performance.now()-run.qStart)/1000, p=run.current;
  run.log.push({ ok, lat, tag:p.tag, cat:p.cat });
  ok ? run.right++ : run.wrong++;
  $("t-right").textContent=String(run.right);
  $("t-wrong").textContent=String(run.wrong);
  $("ribbon").appendChild(barFor({ok,lat}));
  if (ok){
    run.streak++; run.best=Math.max(run.best,run.streak);
    $("t-streak").textContent=String(run.streak);
    if (run.streak>0 && run.streak%5===0){
      const w=$("streak-wrap"); w.classList.remove("pop"); void w.offsetWidth; w.classList.add("pop");
    }
  } else {
    run.streak=0; $("t-streak").textContent="0";
  }
  const stats=Store.get(K.tag,{}), s=stats[p.tag]||{n:0,sum:0,miss:0};
  s.n++; s.sum+=Math.min(lat,20); if(!ok) s.miss++;
  stats[p.tag]=s; Store.set(K.tag,stats);
  if (!ok){ $("flash").textContent=`${p.answer}${p.unit||""}`;
    setTimeout(()=>{ $("flash").textContent=""; },900); }
  nextProblem();
}
$("answer").addEventListener("input",()=>{
  if (!run) return;
  const raw=$("answer").value.trim().replace(/,/g,"");
  if (!raw||raw==="-"||raw==="."||raw==="-.") return;
  const v=Number(raw);
  if (Number.isFinite(v) && Math.abs(v-run.current.answer)<1e-9) submit(true);
});
$("answer").addEventListener("keydown",e=>{
  if (e.key!=="Enter"||!run) return;
  e.preventDefault();
  const raw=$("answer").value.trim().replace(/,/g,"");
  if (!raw){ submit(false); return; }
  const v=Number(raw);
  submit(Number.isFinite(v) && Math.abs(v-run.current.answer)<1e-9);
});
document.addEventListener("keydown",e=>{
  if (!$("s-drill").classList.contains("on")) return;
  if (document.activeElement===$("answer")) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (/^[0-9.\-]$/.test(e.key)) $("answer").focus();
});
 
/* ══ RESULTS ══════════════════════════════════════════ */
const median = a => { if(!a.length) return 0;
  const x=[...a].sort((p,q)=>p-q), m=x.length>>1;
  return x.length%2 ? x[m] : (x[m-1]+x[m])/2; };
function groupBy(log,key){
  const g={};
  for (const e of log){ const k=e[key];
    (g[k]=g[k]||{n:0,ok:0,lats:[]}); g[k].n++;
    if (e.ok){ g[k].ok++; g[k].lats.push(e.lat); } }
  return g;
}
function finish(){
  clearInterval(timerId);
  const log=run.log, lats=log.filter(e=>e.ok).map(e=>e.lat);
  const acc=log.length ? run.right/log.length : 0;
  const sessions=Store.get(K.ses,[]);
  sessions.push({ t:run.started, dur:S.duration, score:run.right,
    right:run.right, wrong:run.wrong, p50:round(median(lats),2), acc:round(acc,3),
    groups:Object.keys(S.groups).filter(k=>S.groups[k]) });
  Store.set(K.ses, sessions.slice(-80));
 
  $("r-score").textContent=String(run.right);
  $("r-acc").textContent=log.length ? Math.round(acc*100)+"%" : "—";
  $("r-p50").textContent=lats.length ? median(lats).toFixed(1)+"s" : "—";

  drawRibbon($("r-ribbon"),log);
  renderTagTable(log);
  renderHistory(sessions); renderVerdict(log,lats,acc);
  show("s-results"); $("btn-again").focus();
}
function renderTagTable(log){
  const t=$("r-tags"), g=groupBy(log,"tag");
  const rows=Object.entries(g).filter(([,v])=>v.n>=2)
    .map(([tag,v])=>({tag, p50:v.lats.length?median(v.lats):99}))
    .sort((a,b)=>b.p50-a.p50).slice(0,3);
  if (!rows.length){
    t.innerHTML=`<tr><td class="muted">Not enough problems in any one category yet — drag the slider longer for a breakdown.</td></tr>`;
    return;
  }
  t.innerHTML=`<tr><th>Category</th><th>Median</th><th>Method</th></tr>`+
    rows.map(r=>{
      const [label,mid]=TAGS[r.tag]||[r.tag,"l2r"];
      const c=r.p50===99?"var(--cold)":heat(r.p50);
      return `<tr><td class="lbl"><span class="dot" style="background:${c}"></span>${label}</td>
        <td>${r.p50===99?"—":r.p50.toFixed(1)+"s"}</td>
        <td><button class="mlink" data-m="${mid}">${METHOD_BY_ID[mid].name} →</button></td></tr>`;
    }).join("");
}
function renderVerdict(log,lats,acc){
  const v=$("r-verdict");
  if (!log.length){ v.textContent="No answers logged yet — start a drill and type."; return; }
  if (acc<.85){ v.innerHTML=`Accuracy first — <b>${Math.round(acc*100)}%</b> right this run.`; return; }
  const g=groupBy(log,"tag");
  const worst=Object.entries(g).filter(([,x])=>x.n>=2&&x.lats.length)
    .map(([tag,x])=>({tag, p50:median(x.lats)})).sort((a,b)=>b.p50-a.p50)[0];
  if (!worst){ v.textContent="Solid run."; return; }
  const [label,mid]=TAGS[worst.tag]||[worst.tag,"l2r"];
  v.innerHTML=`Slowest category: <b>${label.toLowerCase()}</b>. Try <b>${METHOD_BY_ID[mid].name.toLowerCase()}</b> next.`;
}
function renderHistory(sessions){
  const box=$("r-hist");
  if (sessions.length<2){
    box.innerHTML=`<div class="empty">One session logged. The trend line appears from the second run — daily reps are what move this.</div>`;
    return;
  }
  const recent=sessions.slice(-30), scores=recent.map(s=>s.score);
  const max=Math.max(...scores,1), min=Math.min(...scores,0), span=Math.max(1,max-min);
  const W=100,H=40;
  const pts=recent.map((s,i)=>[ recent.length===1?0:(i/(recent.length-1))*W,
                                H-((s.score-min)/span)*H ]);
  const line=pts.map(p=>`${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(" ");
  const last=recent[recent.length-1], prev=recent[recent.length-2];
  const d=last.score-prev.score;
  box.innerHTML=`
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="Score across your recent sessions">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(242,160,61,.28)"/>
        <stop offset="100%" stop-color="rgba(242,160,61,0)"/></linearGradient></defs>
      <polygon points="0,${H} ${line} ${W},${H}" fill="url(#sg)"/>
      <polyline points="${line}" fill="none" stroke="var(--h2)" stroke-width="1"
                vector-effect="non-scaling-stroke"/>
      <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.2" fill="var(--h4)"/>
    </svg>
    <div class="ribbon-key" style="margin-top:6px">
      <span>${recent.length} sessions</span>
      <span class="ramp" style="background:var(--line-soft)"></span>
      <span>best ${max} · now ${last.score} (${d>=0?"+":""}${d})</span>
    </div>`;
}
 
/* ══ DRAWER ═══════════════════════════════════════════ */
function buildMultTable(){
  const N=20;
  const head=`<tr><th></th>${Array.from({length:N},(_,i)=>`<th>${i+1}</th>`).join("")}</tr>`;
  const rows=Array.from({length:N},(_,r)=>{
    const n=r+1;
    const cells=Array.from({length:N},(_,c)=>
      `<td class="${c===r?"diag":""}">${n*(c+1)}</td>`).join("");
    return `<tr><th>${n}</th>${cells}</tr>`;
  }).join("");
  return `<div class="mtable-wrap"><table class="mtable">${head}${rows}</table></div>`;
}

$("drawer-body").innerHTML = `
  <div class="panel on" id="panel-methods">
    <p class="drawer-note">Each of these is worth more drilled to reflex than twenty tricks read once. Recognizing which one applies is the skill — the arithmetic is the easy half.</p>
    ${METHODS.map(m=>`<div class="method" id="m-${m.id}">
        <h3>${m.name} <code>${m.formula}</code></h3><p>${m.body}</p>
        <div class="ex">${m.ex.map(([q,a])=>`<div><i>${q}</i> &nbsp;→&nbsp; ${a}</div>`).join("")}</div>
      </div>`).join("")}
  </div>
  <div class="panel" id="panel-table">
    <div class="panel-eyebrow">1–20 × 1–20 · squares highlighted</div>
    ${buildMultTable()}
  </div>`;

document.querySelectorAll("#drawer-tabs .tab").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll("#drawer-tabs .tab").forEach(b=>b.classList.toggle("on", b===btn));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="panel-"+btn.dataset.tab));
    $("drawer-body").scrollTop=0;
  };
});

function openDrawer(id){
  $("drawer").classList.add("on"); $("drawer").setAttribute("aria-hidden","false");
  $("scrim").classList.add("on");
  document.querySelectorAll("#drawer-tabs .tab").forEach(b=>b.classList.toggle("on", b.dataset.tab==="methods"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="panel-methods"));
  document.querySelectorAll(".method.lit").forEach(n=>n.classList.remove("lit"));
  if (id){ const n=$("m-"+id);
    if (n){ n.classList.add("lit");
      setTimeout(()=>n.scrollIntoView({block:"start",behavior:"smooth"}),60); } }
  else $("drawer-body").scrollTop=0;
}
function closeDrawer(){
  $("drawer").classList.remove("on"); $("drawer").setAttribute("aria-hidden","true");
  $("scrim").classList.remove("on");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-m]"); if (t) openDrawer(t.dataset.m);
});
$("btn-methods").onclick=()=>openDrawer(null);
$("btn-close-drawer").onclick=closeDrawer;
$("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{
  if (e.key!=="Escape") return;
  if ($("drawer").classList.contains("on")){ closeDrawer(); return; }
  if ($("s-drill").classList.contains("on")){ clearInterval(timerId); finish(); }
});
 
/* ══ WIRING ═══════════════════════════════════════════ */
$("btn-start").onclick=startDrill;
$("btn-again").onclick=startDrill;
$("btn-home").onclick=()=>{ clearInterval(timerId); show("s-setup"); renderSetup(); };
$("btn-clear").onclick=()=>{
  const b=$("btn-clear");
  if (b.dataset.armed){ Store.del(K.ses); Store.del(K.tag);
    b.dataset.armed=""; b.textContent="Clear history"; renderHistory([]); }
  else { b.dataset.armed="1"; b.textContent="Click again to erase";
    setTimeout(()=>{ b.dataset.armed=""; b.textContent="Clear history"; },4000); }
};
if (!Store.live) $("foot-store").textContent="Storage unavailable here — history won't persist";
 
renderSetup();
</script>
